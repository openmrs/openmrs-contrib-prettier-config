name: OpenMRS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
        prettier: ['3.9.8']
        include:
          - node: 20
            prettier: '3.0.0'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: Install minimum supported Prettier
        if: matrix.prettier == '3.0.0'
        run: npm install --no-save --package-lock=false prettier@3.0.0

      - name: Verify formatting contract
        run: npm test

      - name: Verify packed consumers
        run: npm run test:package

      - name: Inspect package contents
        run: npm pack --dry-run --json

  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: verify

    if: github.event_name == 'release' && github.repository == 'openmrs/openmrs-contrib-prettier-config'

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: 🔍 Check release tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}."
            exit 1
          fi

      - name: 📢 Publish release
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
